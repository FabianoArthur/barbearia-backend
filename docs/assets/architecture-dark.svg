@keyframes g0{0%,18.00%{opacity:0;stroke-width:1}19.00%,46.00%{opacity:1;stroke-width:2}49.00%,100%{opacity:0;stroke-width:1}}.g0{animation:g0 10.0s linear infinite}
@media (prefers-reduced-motion:reduce){.pk,.halo,.hl,.glow{animation:none;display:none}}
