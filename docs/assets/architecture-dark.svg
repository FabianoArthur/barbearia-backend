@keyframes t0{0%,1.50%{opacity:0;stroke-dashoffset:100}3.00%{opacity:.9;stroke-dashoffset:100}12.00%{opacity:.9;stroke-dashoffset:0}18.00%,100%{opacity:0;stroke-dashoffset:0}}
.s0{animation:m0 10.0s linear infinite}.l0{animation:t0 10.0s linear infinite}
@keyframes m1{0%,11.50%{opacity:0;stroke-dashoffset:0}13.00%{opacity:1;stroke-dashoffset:0}19.00%{opacity:1;stroke-dashoffset:-100}21.00%,100%{opacity:0;stroke-dashoffset:-100}}
@keyframes t1{0%,11.50%{opacity:0;stroke-dashoffset:100}13.00%{opacity:.9;stroke-dashoffset:100}19.00%{opacity:.9;stroke-dashoffset:0}25.00%,100%{opacity:0;stroke-dashoffset:0}}
.s1{animation:m1 10.0s linear infinite}.l1{animation:t1 10.0s linear infinite}
@keyframes m2{0%,25.50%{opacity:0;stroke-dashoffset:0}27.00%{opacity:1;stroke-dashoffset:0}35.00%{opacity:1;stroke-dashoffset:-100}37.00%,100%{opacity:0;stroke-dashoffset:-100}}
@keyframes t2{0%,25.50%{opacity:0;stroke-dashoffset:100}27.00%{opacity:.9;stroke-dashoffset:100}35.00%{opacity:.9;stroke-dashoffset:0}41.00%,100%{opacity:0;stroke-dashoffset:0}}
.s2{animation:m2 10.0s linear infinite}.l2{animation:t2 10.0s linear infinite}
@keyframes m3{0%,35.50%{opacity:0;stroke-dashoffset:0}37.00%{opacity:1;stroke-dashoffset:0}45.00%{opacity:1;stroke-dashoffset:-100}47.00%,100%{opacity:0;stroke-dashoffset:-100}}
@keyframes t3{0%,35.50%{opacity:0;stroke-dashoffset:100}37.00%{opacity:.9;stroke-dashoffset:100}45.00%{opacity:.9;stroke-dashoffset:0}51.00%,100%{opacity:0;stroke-dashoffset:0}}
.s3{animation:m3 10.0s linear infinite}.l3{animation:t3 10.0s linear infinite}
@keyframes m4{0%,51.50%{opacity:0;stroke-dashoffset:0}53.00%{opacity:1;stroke-dashoffset:0}61.00%{opacity:1;stroke-dashoffset:-100}63.00%,100%{opacity:0;stroke-dashoffset:-100}}
@keyframes t4{0%,51.50%{opacity:0;stroke-dashoffset:100}53.00%{opacity:.9;stroke-dashoffset:100}61.00%{opacity:.9;stroke-dashoffset:0}67.00%,100%{opacity:0;stroke-dashoffset:0}}
.s4{animation:m4 10.0s linear infinite}.l4{animation:t4 10.0s linear infinite}
@keyframes m5{0%,61.50%{opacity:0;stroke-dashoffset:0}63.00%{opacity:1;stroke-dashoffset:0}83.00%{opacity:1;stroke-dashoffset:-100}85.00%,100%{opacity:0;stroke-dashoffset:-100}}
@keyframes t5{0%,61.50%{opacity:0;stroke-dashoffset:100}63.00%{opacity:.9;stroke-dashoffset:100}83.00%{opacity:.9;stroke-dashoffset:0}89.00%,100%{opacity:0;stroke-dashoffset:0}}
