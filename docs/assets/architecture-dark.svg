<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Barbershop API architecture</title>
<desc id="desc">A client books a slot on the public booking page (staff use the dashboard). Every request passes helmet and CORS, the rate limit and DTO validation; staff routes also require the CSRF check and the JWT cookie and role guards. The public booking module checks availability and the appointment state machine, saves the appointment through Prisma in PostgreSQL (CPF and phone encrypted with AES-256-GCM) and enqueues a delayed BullMQ job in Redis. Thirty minutes before the slot the reminder worker sends a WhatsApp message to the client through Twilio.</desc>
