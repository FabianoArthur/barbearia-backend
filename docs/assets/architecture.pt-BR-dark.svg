<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" role="img" aria-labelledby="title desc" lang="pt-BR">
<title id="title">Arquitetura da API de barbearia</title>
<desc id="desc">O cliente agenda um horário na página pública (a equipe usa o painel). Toda requisição passa por helmet e CORS, pelo limite de taxa e pela validação dos DTOs; as rotas da equipe também exigem a checagem de CSRF e os guards de JWT em cookie e de papéis. O módulo de agendamento público confere a disponibilidade e a máquina de estados, grava o agendamento via Prisma no PostgreSQL (CPF e telefone cifrados com AES-256-GCM) e enfileira um job atrasado do BullMQ no Redis. Trinta minutos antes do horário, o worker de lembrete envia um WhatsApp ao cliente via Twilio.</desc>
<style>
text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3}
.b{font-size:14px;font-weight:600}
.h{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.m{font-size:12.5px;fill:#9198a1}
.code{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:12.5px;fill:#aab2ff}
.sepc{fill:#9198a1;font-size:14px}
.bg{fill:#161b22;stroke:#30363d}
.card{fill:#0d1117;stroke:#3d444d}
